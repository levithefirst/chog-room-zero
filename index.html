<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0c0d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/barlow-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-mono-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>Chog: Room Zero</title>
    <style>
      /* Fonts (SIL OFL 1.1, self-hosted in /fonts): Barlow Condensed for words, IBM Plex Mono for numbers so they never jitter. */
      @font-face { font-family: "Barlow Cond"; src: url(/fonts/barlow-condensed-latin-500-normal.woff2) format("woff2"); font-weight: 500; font-display: swap; }
      @font-face { font-family: "Barlow Cond"; src: url(/fonts/barlow-condensed-latin-600-normal.woff2) format("woff2"); font-weight: 600; font-display: swap; }
      @font-face { font-family: "Plex Mono"; src: url(/fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; }
      @font-face { font-family: "Plex Mono"; src: url(/fonts/ibm-plex-mono-latin-600-normal.woff2) format("woff2"); font-weight: 600; font-display: swap; }
      :root { --ink: #ece5d3; --dim: #9a9384; --faint: #5c574e; --hostile: #d0582f; --signal: #f2d98a; --heal: #9fd18b;
        --armor: #8fb0c8; --panel: rgba(14, 15, 16, 0.78); --line: #3a3832; --bg: #0b0c0d;
        --sans: "Barlow Cond", "Arial Narrow", sans-serif; --mono: "Plex Mono", ui-monospace, Menlo, Consolas, monospace;
        --sl: max(14px, env(safe-area-inset-left)); --sr: max(14px, env(safe-area-inset-right));
        --st: max(10px, env(safe-area-inset-top)); --sb: max(10px, env(safe-area-inset-bottom)); --vw: 1vw; --vh: 1vh; }
      /* Landscape stage (src/ui/stage.ts): every layer lives in #stage. A touch device held upright gets the stage
         laid out landscape and turned 90 deg clockwise (body.rot), so the screen's right edge is the stage's top:
         the safe-area insets swap sides with it. */
      body.rot { --st: max(10px, env(safe-area-inset-right)); --sr: max(14px, env(safe-area-inset-bottom));
        --sb: max(10px, env(safe-area-inset-left)); --sl: max(14px, env(safe-area-inset-top)); }
      #stage { position: fixed; inset: 0; overflow: hidden; transform-origin: 0 0; }
      html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--ink);
        font-family: var(--sans); font-weight: 500; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #app { position: absolute; inset: 0; }
      canvas { display: block; touch-action: none; cursor: none; }
      .layer { position: absolute; inset: 0; pointer-events: none; }
      .num { font-family: var(--mono); font-weight: 600; }
      button { font: inherit; color: inherit; cursor: pointer; }
      #vignette { box-shadow: inset 0 0 20vmin 7vmin rgba(208, 88, 47, 0.6); opacity: 0; transition: opacity 120ms linear; }
      #hurt { background: radial-gradient(ellipse at center, transparent 55%, rgba(208, 88, 47, 0.35)); opacity: 0; transition: opacity 250ms ease-out; }

      #hud { opacity: 0; transition: opacity 300ms ease; font-size: 14px; letter-spacing: 0.03em; }
      #hud.on { opacity: 1; }
      #hud > * { position: absolute; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
      #vitals { left: var(--sl); top: var(--st); padding: 8px 10px; width: 190px; }
      .bar { position: relative; height: 10px; background: #26251f; border-radius: 2px; overflow: hidden; margin: 3px 0 5px; }
      .bar > i { position: absolute; inset: 0 auto 0 0; width: 100%; transition: width 120ms linear; }
      #hpfill { background: var(--ink); } #hpfill.low { background: var(--hostile); }
      #arfill { background: var(--armor); }
      #arbar { height: 6px; }
      .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; }
      .row .num { color: var(--ink); font-size: 15px; letter-spacing: 0; }
      #hero { font-size: 12px; color: var(--dim); margin-top: 2px; }
      #foes { left: 50%; top: var(--st); transform: translateX(-50%); padding: 5px 12px; display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; }
      #pips { display: flex; gap: 4px; }
      #pips i { width: 9px; height: 9px; background: var(--hostile); clip-path: polygon(50% 0, 100% 100%, 50% 72%, 0 100%); }
      #pips i.down { background: var(--faint); }
      #sys { right: var(--sr); top: var(--st); display: flex; gap: 8px; pointer-events: auto; }
      #sys button { width: 44px; height: 40px; display: grid; place-items: center; padding: 0; }
      #sys svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 2; }
      #sys #fs { display: none; } body.touch.canfs #sys #fs { display: grid; }
      #weapon { right: var(--sr); bottom: var(--sb); padding: 8px 12px 8px 10px; display: flex; gap: 10px; align-items: center; }
      #ring { width: 40px; height: 40px; transform: rotate(-90deg); }
      #ring circle { fill: none; stroke-width: 4; }
      #ring .track { stroke: #2c2a25; } #ring .fill { stroke: var(--signal); stroke-dasharray: 107; stroke-dashoffset: 107; }
      #wname { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; }
      #ammo { font-size: 26px; line-height: 1; } #ammo small { font-size: 13px; color: var(--dim); }
      #ammo.empty { color: var(--hostile); }
      #ability { right: calc(var(--sr) + 200px); bottom: var(--sb); width: 64px; height: 64px; border-radius: 50%; pointer-events: auto; padding: 0;
        background: conic-gradient(rgba(242, 217, 138, 0.9) var(--cd, 360deg), rgba(40, 38, 33, 0.9) 0); border: none; display: grid; place-items: center; }
      #ability span { width: 54px; height: 54px; border-radius: 50%; background: #17181a; display: grid; place-items: center; font-size: 13px; line-height: 1.05; text-transform: uppercase; letter-spacing: 0.06em; }
      #ability.ready span { background: #2a281f; color: var(--signal); }
      #ability small { display: block; font-size: 10px; color: var(--dim); }
      #reload { display: none; right: calc(var(--sr) + 8px); bottom: calc(var(--sb) + 76px); width: 58px; height: 58px; border-radius: 50%; pointer-events: auto;
        background: var(--panel); border: 1px solid var(--line); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
      body.touch #reload { display: block; }
      body.touch #ability { right: calc(var(--sr) + 78px); bottom: calc(var(--sb) + 76px); width: 72px; height: 72px; }
      body.touch #ability span { width: 62px; height: 62px; }
      body.touch #weapon { right: auto; left: 50%; transform: translateX(-50%); padding: 5px 10px; }
      body.touch #weapon #ring { width: 30px; height: 30px; }
      body.touch #ammo { font-size: 20px; }
      body.touch #ability .keyhint { display: none; }
      /* Tutorial / one-time hints: a small pill under the top HUD row, never over the play centre. */
      #hint { left: 50%; top: calc(var(--st) + 40px); transform: translateX(-50%); max-width: min(36%, 520px); text-align: center; opacity: 0; transition: opacity 600ms ease; font-size: 11px; line-height: 1.35; padding: 4px 10px; border-radius: 12px; background: rgba(16, 23, 29, 0.72); border: 1px solid rgba(242, 237, 228, 0.18); text-shadow: none; pointer-events: none; }
      #toast { left: 50%; top: calc(var(--st) + 82px); transform: translateX(-50%); font-size: 18px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0; transition: opacity 200ms; text-shadow: 0 1px 3px #000; }

      /* Screens: one overlay, one card style, fade + rise transitions. */
      #overlay { display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 40%, rgba(20, 21, 22, 0.82), rgba(6, 7, 8, 0.94));
        pointer-events: auto; opacity: 1; transition: opacity 260ms ease; padding: var(--st) var(--sr) var(--sb) var(--sl); box-sizing: border-box; }
      #overlay.hidden { opacity: 0; pointer-events: none; }
      #overlay.clear { background: linear-gradient(rgba(6, 7, 8, 0.6), transparent 45%); pointer-events: none; align-items: flex-start; padding-top: calc(var(--vh) * 12); }
      .card { max-width: 760px; width: 100%; padding: 0 20px; box-sizing: border-box; animation: rise 320ms cubic-bezier(.2, .7, .2, 1); text-align: center; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      .card h1 { font-size: 56px; letter-spacing: 0.14em; font-weight: 600; margin: 0; line-height: 1; }
      .card h1 em { font-style: normal; color: var(--signal); }
      .card h2 { font-size: 34px; letter-spacing: 0.14em; font-weight: 600; margin: 0 0 8px; text-transform: uppercase; }
      .card p { margin: 6px auto; color: var(--dim); font-size: 17px; max-width: 34em; }
      .card .bad { color: var(--hostile); } .card .good { color: var(--heal); }
      .kicker { font-size: 13px; letter-spacing: 0.3em; color: var(--dim); text-transform: uppercase; margin-bottom: 10px; }
      .btns { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
      .btn { min-width: 150px; min-height: 46px; padding: 0 20px; background: #1b1c1d; border: 1px solid var(--line); border-radius: 4px; font-size: 17px; letter-spacing: 0.12em; text-transform: uppercase; }
      .btn.primary { background: var(--signal); color: #15140f; border-color: var(--signal); font-weight: 600; }
      .btn:focus-visible, .hero:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
      .heroes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; text-align: left; }
      .hero { background: #151617; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; transition: border-color 120ms, transform 120ms; }
      .hero:hover, .hero.sel { border-color: var(--signal); transform: translateY(-2px); }
      .hero b { font-size: 24px; letter-spacing: 0.08em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
      .hero b i { width: 14px; height: 14px; border-radius: 50%; background: var(--ink); box-shadow: inset 0 0 0 3px var(--accent); }
      .hero .role { font-size: 12px; letter-spacing: 0.2em; color: var(--signal); text-transform: uppercase; }
      .hero p { font-size: 14px; margin: 4px 0 6px; line-height: 1.3; }
      .stat { display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 6px; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; margin: 2px 0; }
      .stat s { display: block; height: 5px; background: #2a2924; text-decoration: none; position: relative; }
      .stat s::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--v); background: var(--ink); }
      .hero .ab { font-size: 13px; color: var(--ink); margin-top: 6px; line-height: 1.25; }
      .hero .ab span { color: var(--dim); }
      .hero .wp { font-size: 13px; color: var(--ink); margin-top: 4px; }
      table.stats { margin: 10px auto; border-collapse: collapse; font-size: 17px; }
      table.stats td { padding: 3px 14px; color: var(--dim); text-align: left; }
      table.stats td + td { color: var(--ink); font-family: var(--mono); font-weight: 600; text-align: right; }
      .loadbar { width: 220px; height: 4px; background: #26251f; margin: 16px auto 0; overflow: hidden; }
      .loadbar i { display: block; height: 100%; width: 40%; background: var(--signal); animation: load 0.9s ease-in-out infinite; }
      @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      .mock { display: inline-block; font-size: 12px; letter-spacing: 0.12em; border: 1px solid var(--line); padding: 2px 8px; color: var(--dim); text-transform: uppercase; margin-top: 10px; }
      .demo { display: inline-block; font-size: 11px; letter-spacing: 0.14em; font-weight: 700; color: #15140f; background: var(--signal); border-radius: 3px; padding: 1px 5px; vertical-align: middle; line-height: 1.4; }
      .pb { font-size: 14px !important; color: var(--ink) !important; } .pb span { color: var(--dim); } .pb b { color: var(--heal); font-size: 12px; }
      .democopy { color: var(--ink) !important; border: 1px solid var(--signal); border-radius: 4px; padding: 6px 10px; font-size: 14px !important; }
      table.howto, table.traits { margin: 8px auto; border-collapse: collapse; font-size: 15px; text-align: left; }
      table.howto td, table.traits td, table.traits th { padding: 3px 10px; color: var(--dim); vertical-align: top; }
      table.howto td:first-child, table.traits td:first-child { color: var(--signal); white-space: nowrap; text-transform: uppercase; font-size: 13px; letter-spacing: 0.1em; }
      table.traits th { color: var(--ink); font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; text-align: left; }
      table.traits td:nth-child(3) { color: var(--ink); }
      #overlay .card { max-height: 100%; overflow-y: auto; }

      /* ---- RC-7 design system: menus, profile, settings, results. One panel style, one gold accent, mono numbers. ---- */
      /* Before the script runs, an upright touch screen already gets the landscape stage (stage.ts takes over). */
      @media (pointer: coarse) and (orientation: portrait) {
        body:not(.staged) #stage { right: auto; bottom: auto; width: 100vh; height: 100vw; transform: translate(100vw, 0) rotate(90deg); }
      }
      #boot { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; text-align: center; transition: opacity 350ms ease;
        background: radial-gradient(ellipse at 50% 40%, #16191b, #060708); }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot h1 { font-size: 46px; letter-spacing: 0.14em; font-weight: 600; margin: 4px 0 18px; } #boot h1 em { font-style: normal; color: var(--signal); }
      .bootbar { width: min(320px, 60%); height: 4px; margin: 0 auto; background: #26251f; overflow: hidden; border-radius: 2px; }
      .bootbar i { display: block; height: 100%; width: 0; background: var(--signal); transition: width 250ms ease; }
      #bootstep { margin-top: 10px; font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; color: var(--dim); text-transform: uppercase; }
      #booterr { color: var(--hostile); font-size: 15px; max-width: 30em; margin: 12px auto 0; }
      .btn:active:not(:disabled), .navbtn:active, .icon-btn:active, .hero:active { transform: translateY(1px); filter: brightness(1.15); }
      .btn:disabled, .icon-btn:disabled, .toggle:disabled { opacity: 0.45; cursor: not-allowed; }
      .btn:hover:not(:disabled), .navbtn:hover, .icon-btn:hover { border-color: var(--signal); }
      .btn.small { min-width: 0; min-height: 34px; padding: 0 12px; font-size: 14px; letter-spacing: 0.08em; }
      .btn.danger { border-color: var(--hostile); color: var(--hostile); }
      .btn.on { border-color: var(--signal); color: var(--signal); }
      .btn.play { min-width: 200px; min-height: 64px; font-size: 30px; letter-spacing: 0.2em; }
      .icon-btn { width: 42px; height: 40px; display: inline-grid; place-items: center; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
      .icon-btn.small { width: 34px; height: 32px; }
      .icon-btn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      button:focus-visible, .field:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
      #overlay > .screen { width: 100%; height: 100%; display: flex; flex-direction: column; animation: rise 280ms cubic-bezier(.2, .7, .2, 1); min-height: 0; }
      .topbar { display: flex; align-items: center; gap: 12px; min-height: 46px; }
      .bar-title { flex: 1; margin: 0; font-size: 26px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; text-align: center; }
      .bar-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
      .player-chip { display: flex; align-items: center; gap: 10px; padding: 4px 12px 4px 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; text-align: left; position: relative; }
      .player-chip b { display: block; font-size: 18px; letter-spacing: 0.06em; } .player-chip small { color: var(--dim); font-size: 12px; letter-spacing: 0.06em; }
      .token { width: 34px; height: 34px; flex: none; }
      .new { position: absolute; top: -7px; right: -8px; font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; background: var(--signal); color: #15140f; border-radius: 3px; padding: 1px 4px; }
      .menu-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(150px, 200px) 1fr minmax(190px, 240px); gap: 16px; align-items: center; }
      .menu-nav { display: flex; flex-direction: column; gap: 8px; }
      .navbtn { text-align: left; padding: 10px 14px; min-height: 42px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--signal); border-radius: 4px;
        font-size: 17px; letter-spacing: 0.1em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .navbtn .num { color: var(--signal); font-size: 13px; }
      .showcase { text-align: center; min-width: 0; }
      .showcase h1 { font-size: 52px; letter-spacing: 0.14em; font-weight: 600; margin: 0; line-height: 1; } .showcase h1 em { font-style: normal; color: var(--signal); }
      .lede { color: var(--dim); font-size: 16px; margin: 8px auto 10px; max-width: 30em; }
      .op-show { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; padding: 0; }
      .op-show .portrait { height: min(190px, calc(var(--vh) * 34)); width: auto; border-radius: 6px; border: 1px solid var(--line); }
      .op-show > span { display: flex; flex-direction: column; align-items: center; }
      .op-show b { font-size: 22px; letter-spacing: 0.1em; text-transform: uppercase; } .op-show small { color: var(--dim); font-size: 13px; letter-spacing: 0.06em; }
      .menu-act { display: flex; flex-direction: column; align-items: stretch; gap: 10px; text-align: center; align-self: end; padding-bottom: 6px; }
      .menu-act .mock { margin: 0 auto; } .menu-act .pb { margin: 0; }
      /* Operator select */
      .screen.select .heroes { flex: 1; min-height: 0; overflow-y: auto; margin: 8px 0; align-content: center; }
      .hero-art { position: relative; text-align: center; }
      .hero-art .portrait { width: 100%; max-height: 120px; border-radius: 4px; }
      .hero .fav { position: absolute; top: 4px; right: 6px; font-style: normal; color: var(--signal); font-size: 16px; }
      .hero .career { margin-top: 6px; font-size: 12px; color: var(--signal); font-family: var(--mono); }
      .foot { display: flex; gap: 10px; align-items: center; justify-content: flex-end; }
      .foot .hint-line { margin-right: auto; color: var(--dim); font-size: 13px; letter-spacing: 0.06em; }
      .foot .play { min-height: 52px; font-size: 24px; min-width: 180px; }
      /* Profile */
      .tabs { display: flex; justify-content: center; gap: 6px; margin: 4px 0 8px; }
      .tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 6px 12px; font-size: 18px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
      .tab.on { color: var(--ink); border-bottom-color: var(--signal); }
      .prof-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(170px, 230px) 1fr; gap: 16px; }
      .pcard { background: linear-gradient(#17191b, #0f1112); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow: hidden; }
      .pcard-head { display: flex; align-items: center; gap: 6px; } .pcard-head span { flex: 1; min-width: 0; } .pcard-head .token { width: 28px; height: 28px; }
      .pcard-head b { display: block; font-size: 17px; line-height: 1.1; letter-spacing: 0.04em; overflow-wrap: anywhere; } .pcard-head small { color: var(--dim); font-family: var(--mono); font-size: 11px; }
      .pcard-art { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; }
      .pcard-art .portrait { max-height: 100%; max-width: 100%; height: min(220px, calc(var(--vh) * 36)); border-radius: 6px; }
      .pcard-op { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
      .pins { display: flex; justify-content: center; gap: 8px; }
      .pin { width: 40px; height: 44px; display: grid; place-items: center; } .pin .medal-badge { width: 40px; height: 44px; }
      .pin.empty { border: 1px dashed var(--line); border-radius: 50%; width: 36px; height: 36px; color: var(--faint); font-size: 18px; }
      .links { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
      .linkchip { font-size: 11px; letter-spacing: 0.06em; border: 1px solid var(--line); border-radius: 10px; padding: 2px 8px; color: var(--ink); white-space: nowrap; }
      .linkchip.dim { color: var(--dim); }
      .tabbody { min-height: 0; overflow-y: auto; text-align: left; padding-right: 4px; }
      .tabbody h3, .settings h3, .earned h3 { margin: 2px 0 8px; font-size: 18px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; }
      .tabbody h3 small, .tabbody h3 .num { font-size: 12px; color: var(--dim); letter-spacing: 0.06em; text-transform: none; font-weight: 500; margin-left: 6px; }
      table.kv { width: 100%; border-collapse: collapse; font-size: 15px; } table.kv td { padding: 4px 8px; border-bottom: 1px solid #1f1f1c; color: var(--dim); }
      table.kv td.num { color: var(--ink); text-align: right; }
      .opgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
      .opmini { display: flex; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
      .opmini.fav { border-color: var(--signal); } .opmini > div { flex: 1; min-width: 0; }
      .opmini .portrait { width: 70px; height: 84px; flex: none; border-radius: 4px; }
      .opmini b { font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; } .opmini small { display: block; color: var(--dim); font-size: 12px; margin-bottom: 4px; }
      .opmini table.kv { font-size: 13px; } .opmini table.kv td { padding: 1px 4px; } .opmini .btn { margin-top: 6px; }
