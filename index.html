<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0E091C" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/barlow-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-mono-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>Chog: Room Zero</title>
    <style>
      /* Fonts (SIL OFL 1.1, self-hosted in /fonts): Barlow Condensed for words, IBM Plex Mono for numbers so they never jitter. */
      @font-face { font-family: "Barlow Cond"; src: url(/fonts/barlow-condensed-latin-500-normal.woff2) format("woff2"); font-weight: 500; font-display: swap; }
      @font-face { font-family: "Barlow Cond"; src: url(/fonts/barlow-condensed-latin-600-normal.woff2) format("woff2"); font-weight: 600; font-display: swap; }
      @font-face { font-family: "Plex Mono"; src: url(/fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; }
      @font-face { font-family: "Plex Mono"; src: url(/fonts/ibm-plex-mono-latin-600-normal.woff2) format("woff2"); font-weight: 600; font-display: swap; }
      /* PROVISIONAL CHOG palette (RC-8): the exact values of CHOG_Room_Zero_Brand_Guide.pdf, which states that no official
         CHOG colour system exists. Not official CHOG colours. Same values as src/config/brand.ts (tests/rc8-brand.test.ts). */
      :root { --chog-purple: #6B3FA0; --chog-purple-deep: #4A2C7A; --chog-purple-bright: #8B5CF6; --chog-cream: #FFF8E7;
        --chog-cream-warm: #F5E6C8; --chog-pink: #FF6B9D; --chog-pink-soft: #FFB6C1;
        --bg-deep: #0E091C; --bg-panel: #1A1228; --bg-elevated: #2A1F3D;
        --health: #22C55E; --armor: #3B82F6; --ammo: #F59E0B; --damage: #EF4444; --enemy: #DC2626; --ally: #10B981;
        --pickup: #A78BFA; --danger-zone: #FF2D2D; --danger-glow: #FF6B6B; --border: #C4BFD4; --disabled: #6B6580;
        /* Roles the components use, mapped onto the tokens. Text accents use pink (7.3:1 on --bg-deep, 6.8:1 on panels);
           bright purple only passes 4.5:1 on --bg-deep (4.3:1 on panels), so it is a fill behind cream text instead. */
        --ink: var(--chog-cream); --dim: var(--border); --faint: var(--disabled); --hostile: var(--danger-glow);
        --signal: var(--chog-pink); --primary: var(--chog-purple-bright); --heal: var(--health);
        --panel: rgba(26, 18, 40, 0.86); --line: rgba(196, 191, 212, 0.28); --bg: var(--bg-deep);
        --sans: "Barlow Cond", "Arial Narrow", sans-serif; --mono: "Plex Mono", ui-monospace, Menlo, Consolas, monospace;
        --sl: max(14px, env(safe-area-inset-left)); --sr: max(14px, env(safe-area-inset-right));
        --st: max(10px, env(safe-area-inset-top)); --sb: max(10px, env(safe-area-inset-bottom)); --vw: 1vw; --vh: 1vh; }
      /* Landscape stage (src/ui/stage.ts): every layer lives in #stage. A touch device held upright gets the stage
         laid out landscape and turned 90 deg clockwise (body.rot), so the screen's right edge is the stage's top:
         the safe-area insets swap sides with it. */
      body.rot { --st: max(10px, env(safe-area-inset-right)); --sr: max(14px, env(safe-area-inset-bottom));
        --sb: max(10px, env(safe-area-inset-left)); --sl: max(14px, env(safe-area-inset-top)); }
      #stage { position: fixed; inset: 0; overflow: hidden; transform-origin: 0 0; }
      html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--ink);
        font-family: var(--sans); font-weight: 500; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #app { position: absolute; inset: 0; }
      canvas { display: block; touch-action: none; cursor: none; }
      .layer { position: absolute; inset: 0; pointer-events: none; }
      .num { font-family: var(--mono); font-weight: 600; }
      button { font: inherit; color: inherit; cursor: pointer; }
      #vignette { box-shadow: inset 0 0 20vmin 7vmin rgba(239, 68, 68, 0.6); opacity: 0; transition: opacity 120ms linear; }
      #hurt { background: radial-gradient(ellipse at center, transparent 55%, rgba(239, 68, 68, 0.35)); opacity: 0; transition: opacity 250ms ease-out; }

      #hud { opacity: 0; transition: opacity 300ms ease; font-size: 14px; letter-spacing: 0.03em; }
      #hud.on { opacity: 1; }
      #hud > * { position: absolute; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
      #vitals { left: var(--sl); top: var(--st); padding: 8px 10px; width: 190px; }
      .bar { position: relative; height: 10px; background: var(--bg-elevated); border-radius: 2px; overflow: hidden; margin: 3px 0 5px; }
      .bar > i { position: absolute; inset: 0 auto 0 0; width: 100%; transition: width 120ms linear; }
      #hpfill { background: var(--health); } #hpfill.low { background: var(--damage); }
      /* CF: the health you just lost stays as a pale segment for a moment, then drains: you see the size of the hit. */
      #hpghost { background: var(--chog-cream); opacity: 0.8; transition: none; }
      #arfill { background: var(--armor); }
      #arbar { height: 6px; }
      .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; }
      .row .num { color: var(--ink); font-size: 15px; letter-spacing: 0; }
      #hero { font-size: 12px; color: var(--dim); margin-top: 2px; }
      /* GP: a timed effect on you (a Snare slow) in words and seconds, never a silent slow-down. */
      #tracker { display: block; width: 100%; height: auto; margin-top: 5px; border: 1px solid var(--line); border-radius: 4px; background: rgba(8, 6, 16, 0.75); } #tracker[hidden] { display: none; }
      #status { font-size: 12px; color: var(--armor); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 3px; min-height: 0; }
      #status:empty { display: none; }
      #perk { font-size: 12px; color: var(--signal); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 3px; }
      #perk:empty { display: none; }
      /* GP downed window: the countdown and the revive, centre top, big enough to read mid-fight on a phone. */
      #downcard { left: 50%; top: calc(var(--st) + 112px); transform: translateX(-50%); text-align: center; padding: 8px 16px 10px; min-width: 220px; display: none; }
      #downcard.on { display: block; }
      /* Phones: the card sits higher and smaller, so it never covers you (the stage centre) while you are down. */
      body.compact #downcard { top: calc(var(--st) + 46px); padding: 4px 12px 6px; min-width: 200px; }
      body.compact #downcard b { font-size: 12px; } body.compact #downcard .num { font-size: 22px; } body.compact #downcard small { font-size: 12px; }
      body.compact table.board th { padding: 2px 6px; }
      #downcard b { display: block; font-size: 15px; letter-spacing: 0.16em; color: var(--damage); }
      #downcard .num { display: block; font-size: 30px; line-height: 1.1; color: var(--ink); }
      #downcard small { display: block; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; }
      #downcard .bar { width: 100%; margin-top: 6px; }
      #downbar { background: var(--health); width: 0; }
      #downcard.save b { color: var(--health); }
      #foes { left: 50%; top: var(--st); transform: translateX(-50%); padding: 5px 12px; display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; }
      #pips { display: flex; gap: 4px; }
      #pips i { width: 9px; height: 9px; background: var(--enemy); clip-path: polygon(50% 0, 100% 100%, 50% 72%, 0 100%); }
      #pips i.down { background: var(--faint); }
      /* Danger zone (RC-8): a ring icon + words + countdown, never colour alone. Red only once it can hurt you. */
      #zone { display: flex; gap: 6px; align-items: center; padding-left: 8px; border-left: 1px solid var(--line); }
      #zone i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--dim); box-sizing: border-box; }
      #zone b { font-weight: 600; } #ztime { color: var(--ink); font-size: 14px; letter-spacing: 0; }
      #zone.hot b, #zone.hot #ztime { color: var(--danger-glow); } #zone.hot i { border-color: var(--danger-zone); }
      #foes.outside { border-color: var(--danger-zone); box-shadow: 0 0 0 1px var(--danger-zone); }
      #foes.outside #zone b { color: var(--chog-cream); background: var(--danger-zone); padding: 0 5px; border-radius: 3px; }
      #zoneedge { box-shadow: inset 0 0 16vmin 5vmin rgba(255, 45, 45, 0.5); opacity: 0; transition: opacity 200ms linear; }
      #sys { right: var(--sr); top: var(--st); display: flex; gap: 8px; pointer-events: auto; }
      #feed { right: var(--sr); top: calc(var(--st) + 50px); list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-size: 12px; pointer-events: none; }
      #feed li { background: rgba(11,12,13,.62); padding: 2px 8px; border-radius: 3px; color: var(--dim); white-space: nowrap; }
      #feed li.mine { color: var(--chog-cream); } #feed li.down { font-style: italic; } #feed b.h { color: var(--damage); font-weight: 600; } #feed b.f { color: var(--team); font-weight: 600; }
      #sys button { width: 44px; height: 40px; display: grid; place-items: center; padding: 0; }
      #sys svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 2; }
      #sys #fs { display: none; } body.touch.canfs #sys #fs { display: grid; }
      #weapon { right: var(--sr); bottom: var(--sb); padding: 8px 12px 8px 10px; display: flex; gap: 10px; align-items: center; }
      #ring { width: 40px; height: 40px; transform: rotate(-90deg); }
      #ring circle { fill: none; stroke-width: 4; }
      #ring .track { stroke: var(--bg-elevated); } #ring .fill { stroke: var(--ammo); stroke-dasharray: 107; stroke-dashoffset: 107; }
      #wname { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; }
      #ammo { font-size: 26px; line-height: 1; } #ammo small { font-size: 13px; color: var(--dim); }
      #ammo.empty { color: var(--hostile); }
      #ability { right: calc(var(--sr) + 200px); bottom: var(--sb); width: 64px; height: 64px; border-radius: 50%; pointer-events: auto; padding: 0;
        background: conic-gradient(rgba(139, 92, 246, 0.95) var(--cd, 360deg), rgba(42, 31, 61, 0.92) 0); border: none; display: grid; place-items: center; }
      #ability span { width: 54px; height: 54px; border-radius: 50%; background: var(--bg-panel); display: grid; place-items: center; font-size: 13px; line-height: 1.05; text-transform: uppercase; letter-spacing: 0.06em; }
      #ability.ready span { background: var(--bg-elevated); color: var(--signal); }
      /* CF: one pulse when the ability comes back (the 'ready' tone plays with it). */
      #ability.pulse { animation: abpulse 420ms ease-out 1; }
      @keyframes abpulse { 0% { box-shadow: 0 0 0 0 rgba(255, 122, 182, 0.75); } 100% { box-shadow: 0 0 0 16px rgba(255, 122, 182, 0); } }
      @media (prefers-reduced-motion: reduce) { #ability.pulse { animation: none; } }
      #ability small { display: block; font-size: 12px; color: var(--dim); }
      #reload { display: none; right: calc(var(--sr) + 8px); bottom: calc(var(--sb) + 76px); width: 58px; height: 58px; border-radius: 50%; pointer-events: auto;
        background: var(--panel); border: 1px solid var(--line); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
      body.touch #reload { display: block; }
      /* Grenade: a real control with its count, beside the ability (PC: G or right click). Empty = dimmed, 0 shown. */
      #nade { right: calc(var(--sr) + 276px); bottom: calc(var(--sb) + 4px); width: 56px; height: 56px; border-radius: 50%; pointer-events: auto; padding: 0;
        background: rgba(26, 18, 40, 0.9); border: 2px solid var(--ammo); color: var(--ink); display: grid; place-items: center; }
      #nade svg { width: 28px; height: 28px; fill: none; stroke: var(--ammo); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      #nade b { position: absolute; right: -4px; top: -4px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--ammo); color: var(--bg-deep);
        font-size: 13px; line-height: 22px; text-align: center; padding: 0 4px; }
      #nade small { position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--dim); }
      #nade.empty { border-color: var(--line); opacity: 0.55; } #nade.empty svg { stroke: var(--dim); } #nade.empty b { background: var(--disabled); color: var(--ink); }
      #nade.cool svg { opacity: 0.45; }
      body.touch #nade { right: calc(var(--sr) + 160px); bottom: calc(var(--sb) + 84px); width: 62px; height: 62px; }
      body.touch #nade small { display: none; }
      body.touch #ability { right: calc(var(--sr) + 78px); bottom: calc(var(--sb) + 76px); width: 72px; height: 72px; }
      body.touch #ability span { width: 62px; height: 62px; }
      body.touch #weapon { right: auto; left: 50%; transform: translateX(-50%); padding: 5px 10px; }
      body.touch #weapon #ring { width: 30px; height: 30px; }
      body.touch #ammo { font-size: 20px; }
      body.touch #ability .keyhint { display: none; }
      /* Tutorial / one-time hints: a small pill under the top HUD row, never over the play centre. */
      #hint { left: 50%; top: calc(var(--st) + 40px); transform: translateX(-50%); max-width: min(52%, 600px); text-align: center; opacity: 0; transition: opacity 600ms ease; font-size: 12px; line-height: 1.35; padding: 4px 10px; border-radius: 12px; background: rgba(26, 18, 40, 0.86); border: 1px solid rgba(196, 191, 212, 0.28); text-shadow: none; pointer-events: none; }
      /* CF lab switches (dev/test builds only, ?lab): small, out of the HUD's way. */
      #lab { position: fixed; left: 50%; bottom: 6px; transform: translateX(-50%); z-index: 50; display: flex; gap: 4px; align-items: center; font: 600 12px/1 'Plex Mono', monospace; color: var(--dim); background: rgba(10, 10, 14, 0.7); padding: 4px 6px; border-radius: 4px; }
      #lab a { color: var(--dim); text-decoration: none; padding: 3px 5px; border: 1px solid var(--line); border-radius: 3px; }
      #lab a.on { color: var(--signal); border-color: var(--signal); }
      #toast { left: 50%; top: calc(var(--st) + 82px); transform: translateX(-50%); font-size: 18px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0; transition: opacity 200ms; text-shadow: 0 1px 3px #000; }

      /* Screens: one overlay, one card style, fade + rise transitions. */
      #overlay { display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 40%, rgba(26, 18, 40, 0.84), rgba(14, 9, 28, 0.95));
        pointer-events: auto; opacity: 1; transition: opacity 260ms ease; padding: var(--st) var(--sr) var(--sb) var(--sl); box-sizing: border-box; }
      #overlay.hidden { opacity: 0; pointer-events: none; }
      #overlay.clear { background: linear-gradient(rgba(14, 9, 28, 0.6), transparent 45%); pointer-events: none; align-items: flex-start; padding-top: calc(var(--vh) * 12); }
      .card { max-width: 760px; width: 100%; padding: 0 20px; box-sizing: border-box; animation: rise 320ms cubic-bezier(.2, .7, .2, 1); text-align: center; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      .card h1 { font-size: 56px; letter-spacing: 0.14em; font-weight: 600; margin: 0; line-height: 1; }
      .card h1 em { font-style: normal; color: var(--signal); }
      .card h2 { font-size: 34px; letter-spacing: 0.14em; font-weight: 600; margin: 0 0 8px; text-transform: uppercase; }
      .card p { margin: 6px auto; color: var(--dim); font-size: 17px; max-width: 34em; }
      .card .bad { color: var(--hostile); } .card .good { color: var(--heal); }
      /* SB ?perf overlay: real-device numbers for playtests (frame times, load, network, match telemetry). */
      #perf { position: fixed; left: 6px; bottom: 6px; z-index: 50; margin: 0; padding: 4px 6px; font: 10px/1.35 'Plex Mono', monospace; color: #e8f1ff; background: rgba(11, 12, 13, 0.78); border-radius: 6px; pointer-events: none; white-space: pre; max-width: calc(100vw - 12px); overflow: hidden; }
      /* SB death insight: one or two plain reasons under the cause, the first a touch brighter. */
      .card p.insight { color: var(--ink); font-size: 15px; line-height: 1.35; max-width: 30em; margin: 4px auto; padding-left: 14px; text-indent: -14px; }
      .card p.insight::before { content: "\203A  "; color: var(--hostile); }
      .card p.insight + p.insight { color: var(--dim); font-size: 14px; }
      .kicker { font-size: 13px; letter-spacing: 0.3em; color: var(--dim); text-transform: uppercase; margin-bottom: 10px; }
      .btns { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
      /* Buttons (brand guide): default --bg-elevated with a --border keyline, hover --chog-purple-bright, pressed
         --chog-pink, disabled --disabled. Primary actions are filled bright purple with cream text. */
      .btn { min-width: 150px; min-height: 46px; padding: 0 20px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 4px; font-size: 17px; letter-spacing: 0.12em; text-transform: uppercase; }
      .btn.primary { background: var(--primary); color: var(--chog-cream); border-color: var(--primary); font-weight: 600; }
      .btn:focus-visible, .hero:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
      .heroes { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; margin-top: 12px; text-align: left; }
      .hero { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; transition: border-color 120ms, transform 120ms; }
      .hero:hover, .hero.sel { border-color: var(--signal); transform: translateY(-2px); }
      .hero b { font-size: 20px; letter-spacing: 0.06em; text-transform: uppercase; display: block; margin: 2px 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .hero b i { width: 14px; height: 14px; border-radius: 50%; background: var(--ink); box-shadow: inset 0 0 0 3px var(--accent); }
      .hero .role { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; margin-top: 6px; font-weight: 600; }
      .hero p { font-size: 14px; margin: 4px 0 6px; line-height: 1.3; }
      .stat { display: grid; grid-template-columns: 46px 1fr auto; align-items: center; gap: 4px; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; margin: 2px 0; }
      .stat s { display: block; height: 5px; background: var(--bg-elevated); text-decoration: none; position: relative; }
      .stat s::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--v); background: var(--ink); }
      .stat em { font-style: normal; font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; min-width: 0; text-align: right; letter-spacing: 0; text-transform: none; }
      .hero .ab { font-size: 13px; color: var(--ink); margin-top: 6px; line-height: 1.25; }
      .hero .ab span { color: var(--dim); }
      .hero .wp { font-size: 13px; color: var(--ink); margin-top: 4px; }
      table.stats { margin: 10px auto; border-collapse: collapse; font-size: 17px; }
      table.stats td { padding: 3px 14px; color: var(--dim); text-align: left; }
      table.stats td + td { color: var(--ink); font-family: var(--mono); font-weight: 600; text-align: right; }
      .loadbar { width: 220px; height: 4px; background: var(--bg-elevated); margin: 16px auto 0; overflow: hidden; }
      .loadbar i { display: block; height: 100%; width: 40%; background: var(--signal); animation: load 0.9s ease-in-out infinite; }
      @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      .mock { display: inline-block; font-size: 12px; letter-spacing: 0.12em; border: 1px solid var(--line); padding: 2px 8px; color: var(--dim); text-transform: uppercase; margin-top: 10px; }
      /* Class system (master build): tier badges are shape + text, not colour alone. */
      .tier { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; border: 1px solid var(--border); border-radius: 3px; padding: 0 5px; line-height: 1.5; vertical-align: middle; color: var(--chog-cream); }
      .tier-free { opacity: 0.7; }
      .tier-common { border-color: var(--border); }
      .tier-uncommon { border-color: var(--ally); }
      .tier-rare { border-color: var(--armor); }
      .tier-epic { border-color: var(--chog-purple-bright); }
      .tier-legendary { border-color: var(--ammo); background: var(--bg-elevated); }
      .xpbar { height: 8px; background: var(--bg-elevated); border-radius: 4px; overflow: hidden; margin: 6px 0; }
      .xpbar i { display: block; height: 100%; background: var(--chog-purple-bright); }
      .btn.mode.locked { opacity: 0.55; }
      .online-card.ident { margin-top: 12px; }
      .btns.tokens .btn.on, .btn.small.on { outline: 2px solid var(--chog-purple-bright); }
      .demo { display: inline-block; font-size: 12px; letter-spacing: 0.14em; font-weight: 700; color: var(--bg-deep); background: var(--signal); border-radius: 3px; padding: 1px 5px; vertical-align: middle; line-height: 1.4; }
      .pb { font-size: 14px !important; color: var(--ink) !important; } .pb span { color: var(--dim); } .pb b { color: var(--heal); font-size: 12px; }
      .democopy { color: var(--ink) !important; border: 1px solid var(--signal); border-radius: 4px; padding: 6px 10px; font-size: 14px !important; }
      table.howto, table.traits { margin: 8px auto; border-collapse: collapse; font-size: 15px; text-align: left; }
      table.howto td, table.traits td, table.traits th { padding: 3px 10px; color: var(--dim); vertical-align: top; }
      table.howto td:first-child, table.traits td:first-child { color: var(--signal); white-space: nowrap; text-transform: uppercase; font-size: 13px; letter-spacing: 0.1em; }
      table.traits th { color: var(--ink); font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; text-align: left; }
      table.traits td:nth-child(3) { color: var(--ink); }
      #overlay .card { max-height: 100%; overflow-y: auto; }

      /* ---- RC-7 design system: menus, profile, settings, results. One panel style, pink accent and purple fills since RC-8, mono numbers. ---- */
      /* Before the script runs, an upright touch screen already gets the landscape stage (stage.ts takes over). */
      @media (pointer: coarse) and (orientation: portrait) {

      .myrank-mini b { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; } .myrank-mini .big { font-size: 20px; color: var(--ink); } .myrank-mini.me .big { color: var(--chog-pink); }
      .hub.cf .board.big table.mini-board td.nm { display: flex; align-items: center; gap: 5px; max-width: none; } .hub.cf .board.big table.mini-board td.nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 130px; }
      .hub.cf .board.big .av, .hub.cf .board.big .av svg { width: 16px; height: 16px; } .hub.cf .board.big td.rk { color: var(--dim); width: 1.6em; }
      .hub.cf .board.big .board-wrap.loading { opacity: .55; } .hub.cf .board.big .rankrule { margin: 4px 0 0; text-transform: uppercase; letter-spacing: .12em; font-size: 9px; }
      .hub.cf .play-wrap { display: grid; justify-items: end; gap: 4px; }
      .hub.cf .play-wrap .status { margin: 0; font-size: 13px; max-width: 320px; text-align: right; }
      /* PLAY: a game button. Angled, lit from inside, presses down; disabled goes grey; loading pulses its edge. */
      .play-cta { position: relative; border: 0; min-width: clamp(200px, 24vw, 340px); min-height: clamp(62px, calc(var(--vh) * 15), 96px); padding: 0 34px; display: grid; align-content: center; justify-items: center; gap: 2px;
        color: var(--chog-cream); background: linear-gradient(100deg, #7b4fe0, var(--chog-purple-bright) 45%, #b26ad8 100%);
        clip-path: polygon(16px 0, 100% 0, calc(100% - 16px) 100%, 0 100%); box-shadow: 0 10px 34px -12px rgba(139, 92, 246, 1); transition: transform 110ms ease, filter 140ms ease; }
      .play-cta::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255, 255, 255, .22), transparent 48%); pointer-events: none; }
      .play-cta .pl { text-transform: uppercase; font-size: clamp(30px, calc(var(--vh) * 8), 52px); letter-spacing: .3em; font-weight: 600; line-height: 1; padding-left: .3em; }
      .play-cta small { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: rgba(255, 248, 231, .82); }
      .play-cta:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
      .play-cta:active:not(:disabled) { transform: translateY(2px) scale(.985); filter: brightness(.95); }
      .play-cta:focus-visible { outline: 2px solid var(--chog-pink); outline-offset: 4px; }
      .play-cta:disabled { background: linear-gradient(100deg, #3a3348, #4a4358); color: rgba(255, 248, 231, .5); box-shadow: none; cursor: not-allowed; }
      .play-cta.loading { background: linear-gradient(100deg, #3b2b5e, #4a2c7a); animation: playwait 1.1s ease-in-out infinite; }
      .play-cta.found { background: linear-gradient(100deg, #0f9a6c, var(--ally)); }
      @keyframes playwait { 50% { box-shadow: 0 0 0 3px rgba(255, 107, 157, .55), 0 10px 34px -12px rgba(139, 92, 246, 1); } }
      @media (prefers-reduced-motion: reduce) { .play-cta.loading { animation: none; } }
      body.compact .hub.cf .hub-right { top: 50px; bottom: 78px; }
      body.compact .hub.cf .navbtn { min-height: 30px; font-size: 12px; }
      body.compact .hub.cf .mode-btn { min-height: 44px; min-width: 64px; padding: 2px 6px; } body.compact .hub.cf .mode-btn b { font-size: 15px; }
      body.compact .hub.cf .maps5 { display: none; } body.compact .hub.cf .map-pick { display: grid; }
      body.compact .hub.cf .board.big table.mini-board tr:nth-child(n+7) { display: none; } body.compact .hub.cf .hub-card.board.big { padding: 6px 8px; }
      body.compact .hub.cf .player-chip > svg { width: 32px; height: 32px; } body.compact .hub.cf .pc-txt > b { font-size: 15px; max-width: 120px; }
      body.compact .chog-cta { min-height: 34px; font-size: 12px; padding: 0 14px; }
      body.compact .hub.cf .hub-right .hub-card { padding: 5px 8px; }
      /* A narrow (upright desktop) window: stack the side columns under the plate. */
      body.narrow .hub.cf .hub-nav { top: auto; bottom: 112px; transform: none; flex-direction: row; flex-wrap: wrap; right: 0; }
      body.narrow .hub.cf .hub-right { display: none; }
      body.narrow .hub.cf .hub-bottom { flex-direction: column; align-items: stretch; } body.narrow .hub.cf .play-cta { width: 100%; }

      /* ---- Enter with CHOG sheet ---- */
      .chog-sheet { max-width: 460px; width: 100%; text-align: left; display: grid; gap: 12px; }
      .chog-head { display: flex; gap: 12px; align-items: center; } .chog-head h2 { margin: 0; }
      .chog-mark { width: 54px; height: 54px; color: var(--ally); flex: none; }
      .chog-track { list-style: none; display: flex; gap: 6px; padding: 0; margin: 0; counter-reset: st; }
      .chog-track li { flex: 1; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); border-top: 3px solid var(--bg-elevated); padding-top: 4px; }
      .chog-track li.done { color: var(--dim); border-top-color: var(--ally); } .chog-track li.now { color: var(--ink); border-top-color: var(--chog-pink); }
      .chog-lede { margin: 0; color: var(--dim); font-size: 15px; line-height: 1.4; }
      /* Wallet chooser (FS): one row per wallet, its mark, its name, and whether it is here (Detected) or a link. */
      .wallet-grid { display: grid; gap: 8px; margin: 4px 0; }
      .btn.wallet-btn { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; text-align: left; text-decoration: none; padding: 6px 12px; }
      .wallet-btn .wmark { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 7px; background: #fff; overflow: hidden; }
      .wallet-btn .wmark svg, .wallet-btn .wmark img { width: 24px; height: 24px; } .wallet-btn .wmark .ico { stroke: var(--bg-deep); }
      .wallet-btn .wname { flex: 1; font-size: 16px; letter-spacing: .04em; } .wallet-btn small { color: var(--dim); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
      a.btn.wallet-btn, a.btn.wallet-btn:visited { color: var(--ink); }
      .chog-sheet, .auth-sheet { max-height: calc(var(--vh, 1vh) * 96); overflow-y: auto; overscroll-behavior: contain; }
      body.compact .btn.wallet-btn { min-height: 40px; } body.compact .wallet-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
      body.compact .chog-sheet { gap: 8px; } body.compact .chog-mark { width: 40px; height: 40px; }
      .chog-busy { display: flex; gap: 12px; align-items: center; min-height: 54px; } .chog-busy p { margin: 0; display: grid; gap: 2px; } .chog-busy small { color: var(--dim); font-size: 14px; }
      .spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--bg-elevated); border-top-color: var(--chog-pink); animation: spin 0.8s linear infinite; flex: none; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }

      /* ---- CF results: the outcome first, big; the numbers land one after another; AGAIN (Enter) is the primary. ---- */
      .card.results { background: linear-gradient(180deg, rgba(26, 18, 40, .92), rgba(14, 9, 28, .96)); border-color: transparent; box-shadow: 0 20px 60px -20px #000; }
      #overlay .card.results h2 { font-size: clamp(36px, calc(var(--vh) * 10), 76px); letter-spacing: .2em; line-height: 1; margin: 4px 0 8px; animation: outin 420ms cubic-bezier(.2, .7, .2, 1) both; }
      .card.results h2.good { color: var(--ally); text-shadow: 0 0 30px rgba(16, 185, 129, .45); }
      .card.results h2.bad { color: var(--hostile); text-shadow: 0 0 30px rgba(239, 68, 68, .4); }
      @keyframes outin { from { opacity: 0; transform: scale(1.12); letter-spacing: .34em; } to { opacity: 1; transform: none; } }
      .card.results .reward-grid .rw { animation: statin 380ms cubic-bezier(.2, .7, .2, 1) both; }
      .card.results .reward-grid .rw:nth-child(2) { animation-delay: 70ms; } .card.results .reward-grid .rw:nth-child(3) { animation-delay: 140ms; }
      .card.results .reward-grid .rw:nth-child(4) { animation-delay: 210ms; } .card.results .reward-grid .rw:nth-child(5) { animation-delay: 280ms; }
      @keyframes statin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      .card.results .btn.again { clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); background: linear-gradient(100deg, #7b4fe0, var(--chog-purple-bright) 45%, #b26ad8); border: 0; min-width: 180px; font-size: 20px; letter-spacing: .24em; }
      @media (prefers-reduced-motion: reduce) { .card.results h2, .card.results .reward-grid .rw { animation: none; } }
          /* UIX briefing (boot and deploy): the location drawn from its real tiles, what you are bringing, one real tip. */
      :root { --mp-floor: #0b0716; --mp-wall: #0b0716; --mp-ground: #2a2042; --mp-cover: #6b5236; --mp-door: #4a3d68; --mp-rail: #4f8fb0; --mp-deck: #34465e; --mp-you: var(--ally); }
      .brief { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; text-align: left; margin: 0 0 14px; padding: 10px 12px; border: 1px solid var(--line); border-left: 3px solid var(--signal); background: rgba(14, 9, 28, 0.72); }
      .brief[hidden] { display: none; }
      .brief .mapbox { width: 168px; height: 104px; border: 1px solid var(--line); background: var(--mp-floor); display: grid; place-items: center; }
      .brief .mapbox svg { width: 100%; height: 100%; display: block; }
      .brief dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; align-items: baseline; }
      .brief dt { font: 600 12px/1.2 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
      .brief dd { margin: 0; font-size: 16px; letter-spacing: 0.04em; color: var(--ink); }
      .brief dd small { display: block; font-size: 13px; color: var(--chog-cream-warm); letter-spacing: 0.01em; }
      .brief dd b { font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
      body.compact .brief { padding: 6px 8px; gap: 10px; margin-bottom: 8px; } body.compact .brief .mapbox { width: 112px; height: 68px; }
      body.compact .brief dd { font-size: 14px; } body.compact .brief dd small { font-size: 12px; }
      #boot .boot-foot { width: min(640px, 92%); }
      /* UIX HUD states. Health: a tick every 25 health (the size of a hit is countable), low health = red bar + words +
         a slow pulse on the panel (never colour alone). Armour: a flash when it breaks. Ammo: amber when low, red with
         RELOAD when the magazine is empty. Ability: the seconds left, over the sweep. */
      #hpbar .ticks { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(var(--seg, 16.6%) - 1px), rgba(14, 9, 28, 0.85) calc(var(--seg, 16.6%) - 1px) var(--seg, 16.6%)); pointer-events: none; }
      #vitals.low { border-color: var(--damage); box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.55); animation: lowpulse 1s ease-in-out infinite; }
      #vitals.low .row:first-child > span:first-child { color: var(--hostile); }
      #vitals.low .row:first-child > span:first-child::after { content: ' · low'; }
      @keyframes lowpulse { 50% { box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.55), 0 0 18px rgba(239, 68, 68, 0.45); } }
      #vitals.broke #arbar { animation: arbreak 600ms ease-out 1; } #vitals.broke .row:nth-child(3) > span:first-child { color: var(--hostile); }
      #vitals.broke .row:nth-child(3) > span:first-child::after { content: ' · broken'; }
      @keyframes arbreak { 0% { box-shadow: 0 0 0 2px var(--armor), 0 0 14px var(--armor); } 100% { box-shadow: none; } }
      #weapon.low #ammo { color: var(--ammo); } #weapon.low #ring .fill { stroke: var(--ammo); }
      #weapon.out { border-color: var(--damage); } #weapon.out #ammo { color: var(--hostile); } #weapon.out #wname::after { content: ' · reload'; color: var(--hostile); }
      #weapon.reloading #ring .fill { stroke: var(--chog-cream); }
      #abcd { position: absolute; inset: 0; display: grid; place-items: center; font-size: 20px; color: var(--ink); pointer-events: none; text-shadow: 0 1px 2px #000; }
      #abcd:empty { display: none; } #ability:not(.ready) #abl { opacity: 0.35; }
      body.reduce-motion #vitals.low { animation: none; }
      /* UIX pause: run state + controls legend (keycaps). */
      .card .reward-grid.pause-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; margin: 12px auto 16px; max-width: 520px; border: 1px solid var(--line); background: rgba(14, 9, 28, 0.6); }
      .pause-grid .rw { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 6px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); } .pause-grid .rw + .rw { border-left: 1px solid var(--line); } .pause-grid .rw b { font-size: 22px; color: var(--ink); letter-spacing: 0; }
      ul.keys { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; padding: 0; margin: 16px 0 0; font-size: 13px; color: var(--dim); }
      ul.keys li { display: flex; gap: 6px; align-items: center; }
      kbd { font: 600 12px/1 var(--mono); color: var(--ink); padding: 4px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; background: var(--bg-elevated); }
      /* UIX compare-again: in play the HUD panels carry less chrome (lighter fill), so the world reads first. */
      #hud .panel { background: rgba(14, 9, 28, 0.62); }
      /* UIX reduced motion (Settings > Motion, or the system preference when it is System): no entrances, pulses or
         sweeps; state changes stay (colour, words, numbers). Gameplay shake is skipped in src/main.ts. */
      body.reduce-motion #overlay *, body.reduce-motion #hud *, body.reduce-motion #overlay, body.reduce-motion #boot * { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
      .row2.wrap { flex-wrap: wrap; row-gap: 4px; padding-bottom: 4px; } .row2.wrap .seg { margin-left: auto; }
      .row2 small.sub { display: block; font-size: 12px; color: var(--dim); letter-spacing: 0.02em; text-transform: none; }

    </style>
  </head>
  <body>
    <div id="stage">
    <div id="app"></div>

    <div id="hurt" class="layer"></div>

        <div class="bar" id="hpbar"><i id="hpghost"></i><i id="hpfill"></i><b class="ticks" aria-hidden="true"></b></div>
        <div class="row"><span>Armour</span><span class="num" id="arn">0</span></div>
        <div class="bar" id="arbar"><i id="arfill"></i></div>
        <div id="hero"></div>
        <div id="status" aria-live="polite"></div>
        <div id="perk"></div>
        <canvas id="tracker" width="170" height="106" hidden aria-label="Visor tracker"></canvas>
      </div>
      <ol id="feed" aria-live="polite"></ol>
      <div id="foes" class="panel"><span id="foesn" class="num">5</span><span>hostiles</span><span id="pips"></span><span id="zone"><i aria-hidden="true"></i><b id="zphase">Zone in</b><span id="ztime" class="num"></span></span></div>
      <div id="sys">
        <button id="fs" class="panel" type="button" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" /></svg></button>
        <button id="mute" class="panel" type="button" aria-label="Mute sound"></button>
        <button id="pause" class="panel" type="button" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" /></svg></button>
      </div>
      <div id="weapon" class="panel">
        <svg id="ring" viewBox="0 0 40 40"><circle class="track" cx="20" cy="20" r="17" /><circle class="fill" id="ringfill" cx="20" cy="20" r="17" /></svg>
        <div><div id="wname"></div><div id="ammo" class="num"></div></div>
      </div>
      <button id="ability" type="button"><span id="abl"></span><b id="abcd" class="num" aria-hidden="true"></b></button>
      <button id="nade" type="button" aria-label="Throw grenade"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="11" cy="14.6" rx="6.2" ry="6.6" /><path d="M8.6 8.2V6.3h4.8v1.9" /><path d="M13.4 6.6c2.4-.2 4-1.4 4.6-3.4" /><circle cx="18.6" cy="3.4" r="1.5" /><path d="M7.5 13.4h7M7.5 16.4h7" /></svg><b id="naden" class="num">3</b><small class="keyhint">G</small></button>
      <button id="reload" type="button">Reload</button>
      <div id="hint"></div>
      <div id="downcard" class="panel" role="status" aria-live="polite"><b id="downh">DOWNED</b><span id="downt" class="num"></span><small id="downwhy"></small><div class="bar"><i id="downbar"></i></div></div>
      <div id="toast"></div>
    </div>
    <div id="overlay" class="layer"></div>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-bg" aria-hidden="true"><i class="boot-grid"></i><i class="boot-beam"></i><i class="boot-beam b2"></i><i class="boot-vig"></i></div>
      <div class="boot-main">
        <svg class="boot-mark" viewBox="0 0 120 120" aria-hidden="true"><defs><radialGradient id="bm" cx="60" cy="60" r="60" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".55"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient></defs>
          <circle cx="60" cy="60" r="58" fill="url(#bm)"/><circle cx="60" cy="60" r="40" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="10 7"/>
          <path d="M60 22l8 14 15-6-3 16 15 5-12 11 9 13-16 1-1 16-14-8-12 11-4-16-16 3 7-15-14-8 15-6-4-16 16 5z" fill="#6B3FA0" stroke="#0E091C" stroke-width="3"/>
          <ellipse cx="60" cy="66" rx="17" ry="13" fill="#FFF8E7"/><circle cx="53" cy="63" r="3.4" fill="#0E091C"/><circle cx="67" cy="63" r="3.4" fill="#0E091C"/><circle cx="47" cy="71" r="3" fill="#FF6B9D" opacity=".85"/><circle cx="73" cy="71" r="3" fill="#FF6B9D" opacity=".85"/></svg>
        <div class="kicker">A Chogathon original · tactical survival</div>
        <h1 class="boot-title"><em>CHOG</em> ROOM ZERO</h1>
        <p class="boot-tag">Lights out. Every step is heard.</p>
      </div>
      <div class="boot-foot">
        <div id="bootbrief" class="brief" hidden></div>
        <p id="boottip" class="in"></p>
        <div class="bootbar"><i id="bootfill"></i></div>
        <div class="boot-row"><span id="bootstep">Loading</span><span id="bootpct" class="num">0%</span></div>
        <div id="booterr" role="alert"></div>
      </div>
    </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
